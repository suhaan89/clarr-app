name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    env:
      # Platzhalter: src/lib/supabase.ts verlangt die Variablen beim Laden.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-platzhalter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  datenbank:
    # Migrationen von Null einspielen und die pgTAP-Tests laufen lassen. Lokal
    # geht das mangels Docker nicht; dieser Job ist noch nie gelaufen, deshalb
    # vorerst nur von Hand (Actions > CI > Run workflow).
    name: Migrationen und pgTAP
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
